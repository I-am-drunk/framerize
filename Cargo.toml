[workspace]
resolver = "2"
default-members = ["apps/framerize"]
members = [
    "crates/framer-protocol",
    "crates/framer-core",
    "crates/framer-api",
    "crates/framer-store",
    "crates/framer-server",
    "crates/framer-host",
    "apps/framerize",
    "apps/framerize-native",
    "crates/framer-native",
]

[workspace.package]
edition = "2021"
license = "MIT"

# Worker fixtures verify the full Node executable within real request deadlines.
# Keep cryptographic hashing fast in local debug/test builds too.
[profile.dev.package.sha2]
opt-level = 3
