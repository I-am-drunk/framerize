[package]
name = "framerize"
version = "0.5.1-alpha.11"
build = "../../scripts/build_identity.rs"
edition.workspace = true
license.workspace = true

[dependencies]
framer-core = { path = "../../crates/framer-core" }
framer-api = { path = "../../crates/framer-api" }
framer-store = { path = "../../crates/framer-store" }
framer-server = { path = "../../crates/framer-server" }
framer-host = { path = "../../crates/framer-host" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
framer-api = { path = "../../crates/framer-api", features = ["test-support"] }
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
