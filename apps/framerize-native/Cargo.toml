[package]
name = "framerize-native"
version = "0.6.0-alpha.1"
build = "../../scripts/build_identity.rs"
edition.workspace = true
license.workspace = true

[dependencies]
framer-native = { path = "../../crates/framer-native" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[features]
browser-transport = ["framer-native/browser-transport"]
