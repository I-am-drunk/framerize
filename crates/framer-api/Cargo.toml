[package]
name = "framer-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
experimental-native = ["tokio/rt"]
native-dispatch = ["experimental-native", "framer-core/native-dispatch", "tokio/macros"]

[dependencies]
framer-core = { path = "../framer-core" }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"
chrono = "0.4"
futures = "0.3"
tokio = { version = "1", features = ["time"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
