[package]
name = "framer-worker-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
