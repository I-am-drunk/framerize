[package]
name = "framerize"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
framer-core = { path = "../framer-core" }
framer-api = { path = "../framer-api" }
framer-store = { path = "../framer-store" }
framer-server = { path = "../framer-server" }
framer-host = { path = "../framer-host" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
