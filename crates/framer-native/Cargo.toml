[package]
name = "framer-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[example]]
name = "worker-smoke"
path = "../../scripts/measure_owned_offline_worker.rs"

[[example]]
name = "compare-v3-collection"
path = "../../scripts/compare_v3_collection.rs"

[dependencies]
framer-core = { path = "../framer-core" }
framer-api = { path = "../framer-api" }
framer-server = { path = "../framer-server" }
framer-store = { path = "../framer-store" }
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = "0.4"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ryu-js = "=1.0.3"
icu_collator = "=2.3.0"
icu_locale_core = "=2.3.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
framer-api = { path = "../framer-api", features = ["test-support"] }
