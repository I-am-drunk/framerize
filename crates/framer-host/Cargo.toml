[package]
name = "framer-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
framer-core = { path = "../framer-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
