[package]
name = "framer-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
serde = "1"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time"] }

[features]
test-support = []

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "test-util", "sync"] }
