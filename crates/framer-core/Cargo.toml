[package]
name = "framer-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
native-dispatch = []

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
