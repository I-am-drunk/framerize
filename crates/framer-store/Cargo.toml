[package]
name = "framer-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
framer-core = { path = "../framer-core" }
async-trait = "0.1"
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
