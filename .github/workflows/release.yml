name: release

on:
  push:
    tags: ['framerize-remote-v*']

permissions:
  contents: read

env:
  NODE_OPTIONS: ''

jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
    with:
      skip_server: true
    secrets: inherit
  assemble:
    needs: qualify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/typescript/bin/tsc -p tsconfig.tools.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-coexistence-${{ github.run_id }}-packages
          path: ${{ runner.temp }}/release-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: package-coexistence-${{ github.run_id }}-report-*
          path: ${{ runner.temp }}/release-reports
      - name: Assemble the verified bytes without repacking
        run: node .tools/scripts/package-release.js "$RUNNER_TEMP/release-input" "$RUNNER_TEMP/release-reports" "$RUNNER_TEMP/release-qualified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release-qualified/
          if-no-files-found: error
          overwrite: true
