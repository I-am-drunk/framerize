name: release

on:
  push:
    tags: ['framer-next-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node scripts/smoke.js
      - run: npm run binary
      - run: node scripts/binary-smoke.js
      - run: npm pack
      - run: cp framer-next-*.tgz dist/
      - run: cp "$(dirname "$(command -v node)")/../LICENSE" dist/NODE-LICENSE
      - run: tar -czf dist/framer-next-linux-x64.tar.gz -C dist framer-next NODE-LICENSE
      - run: cd dist && sha256sum framer-next framer-next-*.tgz framer-next-linux-x64.tar.gz > SHA256SUMS
      - run: node scripts/release-metadata.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*
            framer-next-*.tgz
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/framer-next-v')
    runs-on: ubuntu-22.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - run: cd dist/dist && sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/dist/framer-next-*.tgz
            dist/dist/framer-next-linux-x64.tar.gz
      - run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then export DIST_TAG=next; else export DIST_TAG=latest; fi
          npm publish dist/dist/framer-next-*.tgz --ignore-scripts --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ''
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/framer-next-*.tgz
            dist/framer-next-linux-x64.tar.gz
            dist/SHA256SUMS
            dist/release.json
            dist/NODE-LICENSE
