name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541dca13c1f5b3797a63c337114c8a
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node scripts/smoke.js
      - run: npm run binary
      - run: node scripts/binary-smoke.js
      - run: npm pack
      - run: cp framer-next-*.tgz dist/
      - run: cd dist && sha256sum framer-next framer-next-*.tgz > SHA256SUMS
      - run: node scripts/release-metadata.js
      - run: cp /home/runner/.nvm/versions/node/*/LICENSE dist/NODE-LICENSE
      - run: tar -czf dist/framer-next-linux-x64.tar.gz -C dist framer-next NODE-LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*
            framer-next-*.tgz
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - run: sha256sum -c SHA256SUMS
        working-directory: dist
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/framer-next-*.tgz
            dist/framer-next-linux-x64.tar.gz
      - run: npm publish dist/framer-next-*.tgz --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/framer-next-*.tgz
            dist/framer-next-linux-x64.tar.gz
            dist/SHA256SUMS
            dist/release.json
