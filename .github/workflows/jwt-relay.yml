# GitHub Actions JWT relay — mints Framer AI JWTs from GitHub's runner IPs
# (fresh Azure datacenter IP every run = effectively unlimited IPs) and
# publishes them to .ops/jwt-relay.json for the iris daemon.
#
# TWO jobs:
#   relay-loop  — the workhorse: one 355-minute job looping every 420s.
#                 Restarted every ~5h by cron, so coverage is near-continuous.
#   relay-once  — the IP-rotation bonus: a fresh runner every 15 min, one
#                 pass each (every mint comes from a different IP).
#
# The 600s JWT TTL tolerates cron's real-world delays because relay-loop
# renews at 420s and the daemon falls back to its own mint if a relay file
# ever goes stale.
name: jwt-relay
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */5 * * *"   # restart the long loop ~every 5h (offset from :00)
    - cron: "*/15 * * * *"   # fresh-IP single passes every 15 min

permissions:
  contents: read

jobs:
  relay-once:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: one mint pass (fresh runner IP)
        env:
          RELAY_PAT: ${{ secrets.RELAY_PAT }}
        run: python3 relay/relay_mint.py

  relay-loop:
    if: github.event_name == 'schedule' && github.event.schedule == '17 */5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: mint loop (355 min, every 420s)
        env:
          RELAY_PAT: ${{ secrets.RELAY_PAT }}
        run: |
          END=$((SECONDS + 21000))
          while [ $SECONDS -lt $END ]; do
            python3 relay/relay_mint.py || echo "pass failed, retrying next cycle"
            sleep 420
          done
