# GitHub Actions JWT relay — mints Framer AI JWTs from GitHub's runner IPs
# (fresh Azure datacenter IP every run = effectively unlimited IPs) and
# publishes them to .ops/jwt-relay.json for the iris daemon.
#
# Design after measured GitHub cron unreliability (2026-10-13: zero schedule
# fires in 100 min):
#   relay-loop — THE backbone: a 355-min job looping every 420s. Before
#     exiting, it dispatches its own next run via the API (workflow_dispatch
#     with the RELAY_PAT secret), so coverage is perpetual and never depends
#     on GitHub's cron scheduler. A concurrency group prevents overlap.
#   relay-once — bonus fresh-IP pass on whatever cron fires deliver.
name: jwt-relay

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  relay-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: relay-loop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: mint loop (355 min, every 420s)
        env:
          RELAY_PAT: ${{ secrets.RELAY_PAT }}
        run: |
          END=$((SECONDS + 21000))
          while [ $SECONDS -lt $END ]; do
            python3 relay/relay_mint.py || echo "pass failed, retrying next cycle"
            sleep 420
          done
      - name: dispatch the next loop (self-perpetuating)
        if: always()
        env:
          RELAY_PAT: ${{ secrets.RELAY_PAT }}
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${RELAY_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/I-am-drunk/framerize/actions/workflows/jwt-relay.yml/dispatches \
            -d '{"ref":"main"}' || echo "self-dispatch failed (cron remains as backup)"

  relay-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: relay-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: one mint pass (fresh runner IP)
        env:
          RELAY_PAT: ${{ secrets.RELAY_PAT }}
        run: python3 relay/relay_mint.py
