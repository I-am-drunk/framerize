name: typescript-core

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: ''
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        node: ['22.23.4', '24.13.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Record checkout and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - name: Install development tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and type-check
        run: npm run build && npm run check
      - name: Test core, server and installed transport
        run: npm test
      - name: Test package validation and workflow bindings
        run: npm run test:packages && npm run test:release && npm run test:native-tools
      - name: Test single-request validation offline
        run: npm run test:inference
      - name: Verify the installed artifact offline
        run: node .tools/scripts/core-package-check.js > "$RUNNER_TEMP/core-package-report.json"
      - name: Retain source-bound package result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core-package-report.json
          if-no-files-found: error
      - name: Retain macOS crash reports after a failure
        if: ${{ failure() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crash-macos-node-${{ matrix.node }}-${{ github.run_id }}
          path: |
            ~/Library/Logs/DiagnosticReports/node*
            /Library/Logs/DiagnosticReports/node*
          if-no-files-found: warn
