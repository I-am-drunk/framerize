name: typescript-core

on:
  workflow_call:
  pull_request:
    paths:
      - '.gitattributes'
      - 'scripts/package-*.ts'
      - 'test/package-*'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-remote.yml'
      - 'framerize-core/**'
      - 'framerize-server/**'
      - 'framerize-castle/**'
      - 'test/installed-castle-flow.test.ts'
      - '.github/workflows/package-coexistence.yml'
      - 'framerize-remote/**'
      - 'scripts/core-package-check.ts'
      - 'scripts/build-server.ts'
      - 'scripts/server-castle-runtime.ts'
      - 'scripts/server-native-bundle.ts'
      - 'test/server-*'
      - '.github/workflows/server-ci.yml'
      - 'scripts/check-native-server.ts'
      - 'scripts/native-account-smoke.ts'
      - 'scripts/framer-next-content.ts'
      - 'test/framer-next.test.ts'
      - 'scripts/check-inference.ts'
      - 'scripts/validation/**'
      - 'test/inference-check.test.ts'
      - 'scripts/fixtures/**'
      - 'test/core-package-check.test.ts'
      - 'test/installed-server-flow.test.ts'
      - 'test/installed-remote-flow.test.ts'
      - 'test/installed-custom-routes.test.ts'
      - 'test/custom-*.mjs'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/core-ci.yml'
  push:
    branches: [main, browserless-node, 'restart/**']
    paths:
      - '.gitattributes'
      - 'scripts/package-*.ts'
      - 'test/package-*'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-remote.yml'
      - 'framerize-core/**'
      - 'framerize-server/**'
      - 'framerize-castle/**'
      - 'test/installed-castle-flow.test.ts'
      - '.github/workflows/package-coexistence.yml'
      - 'framerize-remote/**'
      - 'scripts/core-package-check.ts'
      - 'scripts/build-server.ts'
      - 'scripts/server-castle-runtime.ts'
      - 'scripts/server-native-bundle.ts'
      - 'test/server-*'
      - '.github/workflows/server-ci.yml'
      - 'scripts/check-native-server.ts'
      - 'scripts/native-account-smoke.ts'
      - 'scripts/framer-next-content.ts'
      - 'test/framer-next.test.ts'
      - 'scripts/check-inference.ts'
      - 'scripts/validation/**'
      - 'test/inference-check.test.ts'
      - 'scripts/fixtures/**'
      - 'test/core-package-check.test.ts'
      - 'test/installed-server-flow.test.ts'
      - 'test/installed-remote-flow.test.ts'
      - 'test/installed-custom-routes.test.ts'
      - 'test/custom-*.mjs'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/core-ci.yml'

permissions:
  contents: read

env:
  NODE_OPTIONS: ''
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        node: ['22.23.4', '24.13.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Record checkout and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - name: Install development tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch the private Castle library
        env:
          CASTLE_READ_KEY: ${{ secrets.CASTLE_READ_KEY }}
        run: node scripts/fetch-castle.mjs
      - name: Build and type-check
        run: npm run build && npm run check
      - name: Test core, server and installed transport
        run: npm test
      - name: Test package validation and workflow bindings
        run: npm run test:packages && npm run test:release && npm run test:native-tools
      - name: Test single-request validation offline
        run: npm run test:inference
      - name: Verify the installed artifact offline
        run: node .tools/scripts/core-package-check.js > "$RUNNER_TEMP/core-package-report.json"
      - name: Retain source-bound package result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core-package-report.json
          if-no-files-found: error
