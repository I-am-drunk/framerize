name: Browserless candidate

on:
  workflow_dispatch:
  push:
    branches: [browserless]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/camoufox_host.py'
      - '.github/workflows/browserless-candidate.yml'

permissions:
  contents: read

concurrency:
  group: browserless-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - name: Build native candidate
        run: cargo +1.99.0 build --locked --release --package framerize --features native-dispatch
      - name: Bind candidate to source and compiler
        shell: bash
        run: |
          mkdir candidate
          install -m 0755 target/release/framerize candidate/framerize
          git rev-parse HEAD > candidate/source-commit.txt
          rustc +1.99.0 --version --verbose > candidate/compiler.txt
          cp Cargo.lock candidate/Cargo.lock
          (cd candidate && sha256sum framerize source-commit.txt compiler.txt Cargo.lock > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browserless-linux-x86_64-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
