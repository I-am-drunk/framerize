name: Draft an alpha release
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Build applications run on a maintained branch
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: alpha-release
  cancel-in-progress: false
jobs:
  draft:
    if: github.repository == 'I-am-drunk/framerize' && github.ref == 'refs/heads/main'
    environment: framerize-alpha-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require a successful maintained-branch build
        id: source
        run: |
          python3 scripts/check_release_run.py "$CI_RUN_ID"
      - name: Download pinned artifacts and verify package identities
        id: release
        run: python3 scripts/prepare_alpha.py release-assets ci-evidence.json
      - name: Create a new tag and release draft without rebuilding
        run: python3 scripts/publish_alpha.py release-assets release-evidence.json
