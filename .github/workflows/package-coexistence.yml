name: package-coexistence

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: ''

defaults:
  run:
    shell: bash

jobs:
  produce:
    name: produce packages (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Build the shared TypeScript listener
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Pack each package once with private npm configuration
        run: |
          set -euo pipefail
          private="$(mktemp -d "$RUNNER_TEMP/npm-private.XXXXXX")"
          out="$(mktemp -d "$RUNNER_TEMP/coexistence-artifact.XXXXXX")"
          mkdir -p "$private/cache" "$out"
          : > "$private/user.npmrc"
          : > "$private/global.npmrc"
          private_npm() {
            env -i PATH="$PATH" HOME="$private" TMPDIR="$private" \
              npm_config_userconfig="$private/user.npmrc" \
              npm_config_globalconfig="$private/global.npmrc" \
              npm_config_cache="$private/cache" npm_config_offline=true \
              npm_config_ignore_scripts=true npm_config_audit=false \
              npm_config_fund=false npm_config_update_notifier=false \
              npm "$@"
          }
          for dir in framerize-remote framerize-server; do
            (cd "$dir" && private_npm pack --offline --ignore-scripts --pack-destination "$out")
          done
          echo "PRODUCER_NPM=$(private_npm --version)" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$out" >> "$GITHUB_ENV"
      - name: Write producer manifest beside exactly two tarballs
        id: manifest
        run: |
          set -euo pipefail
          node <<'JS'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const out = process.env.ARTIFACT_DIR;
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(sha, process.env.GITHUB_SHA, 'checkout differs from triggering SHA');
          const packages = ['framerize-remote', 'framerize-server'].map((dir) => {
            const { name, version } = JSON.parse(fs.readFileSync(`${dir}/package.json`, 'utf8'));
            assert.equal(name, dir);
            const tarball = `${name}-${version}.tgz`;
            const bytes = fs.readFileSync(path.join(out, tarball));
            return { name, version, tarball,
              sha256: createHash('sha256').update(bytes).digest('hex'), bytes: bytes.length };
          });
          assert.deepEqual(fs.readdirSync(out).sort(), packages.map((entry) => entry.tarball).sort(),
            'pack output must hold exactly the two expected tarballs');
          const toolPaths = ['package.json', 'scripts/package-coexistence.js',
            'scripts/package-archive.js', 'scripts/core-package-check.js',
            'scripts/fixtures/core-installed.js', 'scripts/fixtures/installed-server.js',
            'scripts/fixtures/transport-scenario.js', 'test/installed-remote-flow.test.js',
            'test/package-coexistence.test.js', 'test/package-archive.test.js'];
          const tooling = toolPaths.map((file) => {
            const bytes = file === 'package.json' ? Buffer.from('{"type":"module"}\n')
              : fs.readFileSync(path.join('.tools', file));
            const target = path.join(out, 'tooling', file);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, bytes);
            return { file, bytes: bytes.length,
              sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          const manifest = {
            source: { repository: process.env.GITHUB_REPOSITORY, sha,
              tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
              event: process.env.GITHUB_EVENT_NAME,
              runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT },
            node: process.version, npm: process.env.PRODUCER_NPM,
            platform: process.platform, arch: process.arch, packages, tooling };
          fs.writeFileSync(path.join(out, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          const lines = [`remote=${packages[0].tarball}`, `server=${packages[1].tarball}`];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);
          console.log(JSON.stringify(manifest, null, 2));
          JS
      - name: Upload producer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-coexistence-${{ github.run_id }}-packages
          path: |
            ${{ env.ARTIFACT_DIR }}/manifest.json
            ${{ env.ARTIFACT_DIR }}/${{ steps.manifest.outputs.remote }}
            ${{ env.ARTIFACT_DIR }}/${{ steps.manifest.outputs.server }}
            ${{ env.ARTIFACT_DIR }}/tooling/**
          if-no-files-found: error
          overwrite: true

  consume:
    name: consume packages (${{ matrix.target }}, Node ${{ matrix.node }})
    needs: produce
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22.23.4', '24.13.0']
        target: [linux-x64, macos-arm64, windows-x64]
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: linux-x64
          - runner: macos-15
            platform: darwin
            arch: arm64
            target: macos-arm64
          - runner: windows-2022
            platform: win32
            arch: x64
            target: windows-x64
    env:
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install the pinned type checker without product builds
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolate npm configuration
        run: |
          set -euo pipefail
          private="$(mktemp -d "$RUNNER_TEMP/npm-private.XXXXXX")"
          mkdir -p "$private/cache"
          : > "$private/user.npmrc"
          : > "$private/global.npmrc"
          {
            echo "npm_config_userconfig=$private/user.npmrc"
            echo "npm_config_globalconfig=$private/global.npmrc"
            echo "npm_config_cache=$private/cache"
            echo "npm_config_offline=true"
            echo "npm_config_ignore_scripts=true"
            echo "npm_config_update_notifier=false"
          } >> "$GITHUB_ENV"
      - name: Download producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-coexistence-${{ github.run_id }}-packages
          path: ${{ runner.temp }}/coexistence-input
      - name: Verify producer manifest, source and input hashes
        env:
          INPUT_DIR: ${{ runner.temp }}/coexistence-input
        run: |
          set -euo pipefail
          node <<'JS'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.env.INPUT_DIR;
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'));
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(sha, process.env.GITHUB_SHA, 'checkout differs from triggering SHA');
          assert.equal(manifest.source.sha, sha, 'producer built a different source SHA');
          assert.equal(manifest.source.tree,
            execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            'producer built a different source tree');
          assert.equal(manifest.source.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.source.runId, process.env.GITHUB_RUN_ID);
          assert.equal(manifest.source.event, process.env.GITHUB_EVENT_NAME);
          assert.deepEqual(manifest.packages.map((entry) => entry.name), ['framerize-remote', 'framerize-server']);
          assert.deepEqual(fs.readdirSync(dir).sort(),
            ['manifest.json', 'tooling', ...manifest.packages.map((entry) => entry.tarball)].sort(),
            'artifact must hold exactly the manifest and two tarballs');
          for (const entry of manifest.packages) {
            const { name, version } = JSON.parse(fs.readFileSync(`${entry.name}/package.json`, 'utf8'));
            assert.equal(entry.name, name);
            assert.equal(entry.version, version, `${name} version differs from checkout`);
            assert.equal(entry.tarball, `${name}-${version}.tgz`);
            assert.match(entry.sha256, /^[0-9a-f]{64}$/);
            const bytes = fs.readFileSync(path.join(dir, entry.tarball));
            assert.equal(bytes.length, entry.bytes, `${entry.tarball} size differs from producer`);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), entry.sha256,
              `${entry.tarball} hash differs from producer`);
          }
          const lines = manifest.packages.map((entry, index) =>
            `${index ? 'SERVER' : 'REMOTE'}_TGZ=${path.join(dir, entry.tarball)}`);
          const tools = path.join(dir, 'tooling');
          assert.ok(fs.lstatSync(tools).isDirectory(), 'unsafe tooling root');
          assert.ok(Array.isArray(manifest.tooling) && manifest.tooling.length > 0);
          const toolFiles = fs.readdirSync(tools, { recursive: true }).filter((file) => {
            const info = fs.lstatSync(path.join(tools, file));
            assert.ok(info.isFile() || info.isDirectory(), 'unsafe tooling entry');
            return info.isFile();
          }).map((file) => file.replaceAll('\\', '/')).sort();
          assert.deepEqual(toolFiles, manifest.tooling.map((entry) => entry.file).sort());
          for (const entry of manifest.tooling) {
            assert.match(entry.file, /^(?:package\.json|(?:scripts|test)\/(?:fixtures\/)?[a-z-]+(?:\.test)?\.js)$/);
            const bytes = fs.readFileSync(path.join(tools, entry.file));
            assert.equal(bytes.length, entry.bytes, 'tooling size mismatch');
            assert.equal(createHash('sha256').update(bytes).digest('hex'), entry.sha256,
              'tooling hash mismatch');
          }
          lines.push(`TOOLING_DIR=${tools}`);
          const manifestHash = createHash('sha256')
            .update(fs.readFileSync(path.join(dir, 'manifest.json'))).digest('hex');
          lines.push(`PRODUCER_MANIFEST_SHA256=${manifestHash}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);
          JS
      - name: Verify runner platform
        run: |
          node -e "const assert = require('node:assert/strict');
            assert.equal(process.platform, process.env.EXPECTED_PLATFORM);
            assert.equal(process.arch, process.env.EXPECTED_ARCH);"
      - name: Run root tests
        run: node --test "$TOOLING_DIR/test/package-coexistence.test.js" "$TOOLING_DIR/test/package-archive.test.js"
      - name: Check coexistence of the downloaded tarballs
        run: |
          set -euo pipefail
          report="$(mktemp -d "$RUNNER_TEMP/coexistence-report.XXXXXX")"
          node "$TOOLING_DIR/scripts/package-coexistence.js" "$REMOTE_TGZ" "$SERVER_TGZ" > "$report/checker.json"
          echo "REPORT_DIR=$report" >> "$GITHUB_ENV"
      - name: Exercise the downloaded pair without repacking
        env:
          FRAMERIZE_PACKAGE_REPOSITORY: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node --test "$TOOLING_DIR/test/installed-remote-flow.test.js" 2>&1 | tee "$REPORT_DIR/installed.log"
      - name: Match checker identities to producer manifest
        env:
          INPUT_DIR: ${{ runner.temp }}/coexistence-input
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node <<'JS'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const hash = (file) => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const manifestFile = path.join(process.env.INPUT_DIR, 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          assert.equal(hash(manifestFile), process.env.PRODUCER_MANIFEST_SHA256,
            'producer manifest changed after verification');
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(sha, process.env.GITHUB_SHA, 'checkout changed after verification');
          assert.equal(manifest.source.sha, sha, 'producer source differs from checkout');
          const checker = JSON.parse(fs.readFileSync(path.join(process.env.REPORT_DIR, 'checker.json'), 'utf8'));
          assert.equal(checker.platform, process.env.EXPECTED_PLATFORM);
          assert.equal(checker.arch, process.env.EXPECTED_ARCH);
          assert.equal(checker.node, process.version);
          assert.deepEqual(
            checker.packages.map(({ name, version, tarball, sha256 }) => ({ name, version, tarball, sha256 })),
            manifest.packages.map(({ name, version, tarball, sha256 }) => ({ name, version, tarball, sha256 })),
            'checker identities differ from producer manifest');
          for (const entry of manifest.packages) {
            assert.equal(hash(path.join(process.env.INPUT_DIR, entry.tarball)), entry.sha256,
              `${entry.tarball} changed after verification`);
          }
          for (const entry of manifest.tooling) {
            assert.equal(hash(path.join(process.env.INPUT_DIR, 'tooling', entry.file)), entry.sha256,
              'tooling changed after verification');
          }
          const report = {
            source: { repository: process.env.GITHUB_REPOSITORY,
              event: process.env.GITHUB_EVENT_NAME,
              sha, tree: manifest.source.tree,
              runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT },
            runner: process.env.RUNNER_LABEL, target: process.env.TARGET,
            node: checker.node, npm: checker.npm, platform: checker.platform, arch: checker.arch,
            producer: { manifestSha256: hash(manifestFile), source: manifest.source,
              node: manifest.node, npm: manifest.npm },
            packages: checker.packages,
            installedLogSha256: hash(path.join(process.env.REPORT_DIR, 'installed.log')) };
          fs.writeFileSync(path.join(process.env.REPORT_DIR, 'report.json'),
            `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          JS
      - name: Upload consumer report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-coexistence-${{ github.run_id }}-report-${{ matrix.target }}-node-${{ matrix.node }}
          path: |
            ${{ env.REPORT_DIR }}/report.json
            ${{ env.REPORT_DIR }}/checker.json
            ${{ env.REPORT_DIR }}/installed.log
          if-no-files-found: error
          overwrite: true
