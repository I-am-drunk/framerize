name: ci

on:
  push:
    branches: [framer-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: framerize-nexus

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: framerize-nexus/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - run: node scripts/smoke.js
      - run: node scripts/framer-smoke.js
  package:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run binary
      - run: node scripts/binary-smoke.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framerize-nexus-linux-x64
          path: framerize-nexus/dist/*
          if-no-files-found: error
