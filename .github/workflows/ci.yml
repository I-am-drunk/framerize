name: ci

on:
  push:
    branches: [framer-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: framerize-nexus

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: framerize-nexus/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - run: node scripts/smoke.js
      - run: node scripts/framer-smoke.js
  package:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: framerize-nexus/package-lock.json
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framerize-nexus-package
          overwrite: true
          path: framerize-nexus/framerize-nexus-*.tgz
          if-no-files-found: error
  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            suffix: linux-x64
          - os: macos-15
            suffix: macos-arm64
          - os: windows-2022
            suffix: windows-x64
    runs-on: ${{ matrix.os }}
    needs: package
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify fixture cleanup on macOS
        if: runner.os == 'macOS'
        run: node --test test/smoke-cleanup.test.js
      - run: npm ci
      - run: npm run binary
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framerize-nexus-package
          path: framerize-nexus
      - run: node scripts/package-smoke.js --downloaded
      - run: node scripts/package-binary.js
      - run: node scripts/binary-smoke.js dist/framerize-nexus-${{ matrix.suffix }}.${{ matrix.suffix == 'windows-x64' && 'zip' || 'tar.gz' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framerize-nexus-${{ matrix.suffix }}
          overwrite: true
          path: framerize-nexus/dist/*
          if-no-files-found: error
