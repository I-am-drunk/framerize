name: ci

on:
  push:
    branches: [framer-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack:check
      - run: node scripts/smoke.js
  package:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run binary
      - run: node scripts/binary-smoke.js
      - uses: actions/upload-artifact@v4
        with:
          name: framer-next-linux-x64
          path: dist/*
