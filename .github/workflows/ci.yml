name: Build applications
on:
  push:
    paths: ['apps/**', 'crates/**', 'scripts/**', 'runtime/**', 'web/**', 'reference/decompiled/castle/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: applications-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'I-am-drunk/framerize'
    runs-on: [self-hosted, Linux, X64, imac, framerize]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [framerize, framerize-native]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install compiler
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: application-${{ matrix.app }}
      - name: Set up Node for synthetic worker fixtures
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.13.0'
      - name: Build policy worker fixtures
        if: matrix.app == 'framerize'
        run: |
          mkdir -p target
          cargo +1.99.0 build --locked --release -p framerize-worker --bin framerize-worker --message-format=json > target/policy-worker-artifacts.jsonl
          cargo +1.99.0 build --locked --release -p framerize-worker --example worker_fault --message-format=json > target/policy-fault-artifacts.jsonl
      - name: Bind policy fixture executable paths and hashes
        if: matrix.app == 'framerize'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          fixtures = [('WORKER', 'worker', 'framerize-worker', 'bin'),
                      ('FAULT', 'fault', 'worker_fault', 'example')]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for label, stem, name, kind in fixtures:
                  records = [json.loads(line) for line in pathlib.Path(
                      f'target/policy-{stem}-artifacts.jsonl').read_text().splitlines()]
                  paths = {record['executable'] for record in records
                      if record.get('reason') == 'compiler-artifact'
                      and record.get('executable')
                      and record['target']['name'] == name
                      and kind in record['target']['kind']}
                  assert len(paths) == 1, (label, paths)
                  path = pathlib.Path(paths.pop()).resolve(strict=True)
                  assert not any(c in str(path) for c in '\r\n')
                  digest = hashlib.sha256()
                  with path.open('rb') as source:
                      for block in iter(lambda: source.read(1024 * 1024), b''):
                          digest.update(block)
                  env.write(f'FRAMERIZE_TEST_POLICY_{label}_PATH={path}\n')
                  env.write(f'FRAMERIZE_TEST_POLICY_{label}_SHA256={digest.hexdigest()}\n')
          PY
      - name: Browser and shared-library tests
        if: matrix.app == 'framerize'
        run: cargo +1.99.0 test --locked --release -p framer-protocol -p framer-core -p framer-api -p framer-store -p framer-server -p framer-host -p framerize -p framer-worker-wire -p framerize-worker
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Browser host fixtures
        if: matrix.app == 'framerize'
        run: python -I -B -m unittest discover -s runtime/tests -v
      - name: Build browser interface
        if: matrix.app == 'framerize'
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Native library tests
        if: matrix.app == 'framerize-native'
        run: cargo +1.99.0 test --locked --release -p framer-native -p framerize-native
      - name: Native worker cleanup and handoff fixtures
        if: matrix.app == 'framerize-native'
        run: node --experimental-vm-modules --test scripts/offline_worker/dedicated_pool_tests.mjs scripts/offline_worker/shared_cleanup_tests.mjs scripts/offline_worker/worker_handoff_tests.mjs scripts/offline_worker/collection_tests.mjs scripts/castle_v3_snapshot_values_tests.mjs
      - name: Native worker memory accounting
        if: matrix.app == 'framerize-native'
        run: cargo +1.99.0 test --locked --release -p framer-native --example worker-smoke worker_memory::tests -- --test-threads=1
      - name: Native account fixtures
        if: matrix.app == 'framerize-native'
        run: python -I -B -m unittest discover -s runtime/tests_native -v
      - name: Native SDK encoding comparisons
        if: matrix.app == 'framerize-native'
        run: |
          python -I -B scripts/check_v3_encoding.py
          python -I -B scripts/check_v3_serialization.py
          python -I -B scripts/check_v3_objects.py
          python -I -B scripts/check_v3_worker_result.py
          python -I -B scripts/check_v3_network_result.py
          python -I -B scripts/check_v3_hash.py
          python -I -B scripts/check_v3_network_record.py
          python -I -B scripts/check_native_collation.py
          python -I -B scripts/check_v3_network_events.py
          python -I -B scripts/check_v3_collected.py
          python -I -B scripts/check_v3_collectors.py
          python -I -B scripts/check_v3_network_hash.py
          python -I -B scripts/check_v3_network_metadata.py
          python -I -B scripts/check_v3_deflate.py
          python -I -B scripts/check_v3_envelope.py
      - name: Build explicit application
        run: cargo +1.99.0 build --locked --release --package ${{ matrix.app }}
      - name: Check executable startup
        run: target/release/${{ matrix.app }} --help
      - name: Package application
        run: |
          if [ '${{ matrix.app }}' = 'framerize-native' ]; then
            node scripts/offline_worker/bundle.mjs --output target/native-worker
          fi
          python scripts/package.py ${{ matrix.app }}
      - name: Check browser package lifecycle with empty state
        if: matrix.app == 'framerize'
        run: python -I -B scripts/smoke_browser_package.py dist/framerize-linux-*.tar.gz
      - name: Check native package lifecycle with synthetic state
        if: matrix.app == 'framerize-native'
        run: python -I -B scripts/smoke_native_package.py dist/framerize-native-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.app }}-linux-x86_64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
