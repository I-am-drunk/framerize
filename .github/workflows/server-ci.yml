name: server-ci

on:
  pull_request:
    paths: ['.gitattributes', 'framerize-server/**', 'framerize-core/**', 'scripts/build-server.ts', 'scripts/server-native-bundle.ts', 'scripts/package-archive.ts', 'scripts/native-account-smoke.ts', 'scripts/core-package-check.ts', 'scripts/fixtures/**', 'scripts/*framer-next*', 'test/framer-next.test.ts', 'test/server-*', 'package*.json', 'tsconfig*.json', '.github/workflows/server-ci.yml']
  push:
    branches: [main]
    paths: ['.gitattributes', 'framerize-server/**', 'framerize-core/**', 'scripts/build-server.ts', 'scripts/server-native-bundle.ts', 'scripts/package-archive.ts', 'scripts/native-account-smoke.ts', 'scripts/core-package-check.ts', 'scripts/fixtures/**', 'scripts/*framer-next*', 'test/framer-next.test.ts', 'test/server-*', 'package*.json', 'tsconfig*.json', '.github/workflows/server-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: ''

defaults:
  run:
    working-directory: framerize-server
    shell: bash

jobs:
  qualify:
    name: server (${{ matrix.platform.runner }}, node ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22.23.4', '24.13.0']
        platform:
          - { runner: ubuntu-22.04, arch: x64 }
          - { runner: windows-2022, arch: x64 }
          - { runner: macos-15, arch: arm64 }
    runs-on: ${{ matrix.platform.runner }}
    env:
      EXPECTED_ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: framerize-server/package-lock.json
      - run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the shared TypeScript listener
        run: npm ci --prefix .. --ignore-scripts --no-audit --no-fund && npm run build:server --prefix ..
      - run: npm run test:native-tools --prefix ..
      - run: npm run check
      - run: npm test
      - run: npm run acceptance
      - run: npm run pack:check

  package:
    needs: qualify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: framerize-server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the shared TypeScript listener
        run: npm ci --prefix .. --ignore-scripts --no-audit --no-fund && npm run build:server --prefix ..
      - run: npm pack --ignore-scripts
      - run: npm run pack:check -- --downloaded
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framerize-server-npm
          path: framerize-server/framerize-server-*.tgz
          if-no-files-found: error
          overwrite: true

  native:
    name: native (${{ matrix.target }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x64, target: linux-x64 }
          - { runner: macos-15, arch: arm64, target: macos-arm64 }
          - { runner: windows-2022, arch: x64, target: windows-x64 }
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: framerize-server/package-lock.json
      - run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the shared TypeScript listener
        run: npm ci --prefix .. --ignore-scripts --no-audit --no-fund && npm run build:server --prefix ..
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framerize-server-npm
          path: framerize-server
      - run: npm run pack:check -- --downloaded
      - run: npm run binary
      - run: npm run binary:package
      - run: npm run binary:check
      - run: node scripts/release-metadata.js
      - name: Assemble Framer Next without rebuilding the executable
        env:
          RECOVERY_ARCHIVE: ${{ runner.temp }}/framer-next-${{ matrix.target }}.tar.gz
        run: |
          MANIFEST_HASH=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(require("node:fs").readFileSync("dist/release.json")).digest("hex"))')
          node ../.tools/scripts/package-framer-next.js dist "$MANIFEST_HASH" "$RUNNER_TEMP/framer-next"
          tar --format=ustar -czf "$RECOVERY_ARCHIVE" -C "$RUNNER_TEMP" framer-next
          node -e 'const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto");const file=process.env.RECOVERY_ARCHIVE;fs.writeFileSync(file+".sha256",crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex")+"  "+path.basename(file)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framer-next-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          path: |
            ${{ runner.temp }}/framer-next-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/framer-next-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framerize-server-native-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true
          path: |
            framerize-server/dist/framerize-server*
            framerize-server/dist/LICENSE
            framerize-server/dist/NODE-LICENSE
            framerize-server/dist/SHA256SUMS
            framerize-server/dist/build.json
            framerize-server/dist/release.json

  manifests:
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framerize-server-npm
          path: framerize-server/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framerize-server-native-linux-x64
          path: framerize-server/dist/linux-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framerize-server-native-macos-arm64
          path: framerize-server/dist/macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: framerize-server-native-windows-x64
          path: framerize-server/dist/windows-x64
      - run: node scripts/merge-release-manifests.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framerize-server-qualified
          path: framerize-server/dist/qualified/*
          if-no-files-found: error
          overwrite: true
