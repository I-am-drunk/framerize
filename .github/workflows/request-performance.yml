name: request-performance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: ''
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

defaults:
  run:
    shell: bash

jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.13.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install development tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the measured runtime
        run: npm run build
      - name: Verify requests and record synthetic performance
        run: npm run test:performance
        env:
          FRAMERIZE_PERFORMANCE_REPORT: ${{ runner.temp }}/request-performance.json
      - name: Retain performance measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: request-performance-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/request-performance.json
          if-no-files-found: warn
